name: Build FaceFusion Dev (No NSFW Filter)

on:
  workflow_dispatch:   # uruchamiasz ręcznie przyciskiem

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download official APK (for native libraries)
        run: |
          mkdir -p /tmp/native
          # Pobierz najnowszy oficjalny APK
          curl -L -o /tmp/official.apk https://github.com/AbrahamPaulJ/facefusion-mobile/releases/latest/download/facefusion-mobile-0.9.41.apk || \
          curl -L -o /tmp/official.apk $(curl -s https://api.github.com/repos/AbrahamPaulJ/facefusion-mobile/releases/latest | grep browser_download_url | grep -o 'https://[^"]*\.apk' | head -1)
          
          # Wypakuj biblioteki natywne
          unzip -o /tmp/official.apk "lib/arm64-v8a/*" -d /tmp/
          mkdir -p /tmp/native/arm64-v8a
          cp /tmp/lib/arm64-v8a/*.so /tmp/native/arm64-v8a/

      - name: Build Debug APK
        working-directory: work/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug -PprebuiltNativeDir=/tmp/native --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FaceFusion-Dev-NoNSFW
          path: work/android/app/build/outputs/apk/debug/*.apk