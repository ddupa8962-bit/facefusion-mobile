name: Build FaceFusion Dev (No NSFW Filter)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Download official APK + extract native libs
        run: |
          mkdir -p /tmp/native/arm64-v8a
          curl -L -o /tmp/official.apk "https://github.com/AbrahamPaulJ/facefusion-mobile/releases/download/v0.9.41/facefusion-mobile-0.9.41-release.apk"
          unzip -o /tmp/official.apk "lib/arm64-v8a/*" -d /tmp/
          cp /tmp/lib/arm64-v8a/*.so /tmp/native/arm64-v8a/
          echo "Native libs extracted:"
          ls -la /tmp/native/arm64-v8a/

      - name: Disable qnnStage (we use prebuilt natives)
        working-directory: work/android
        run: |
          # Usuwamy zależność preBuild -> qnnStage, żeby nie próbował stage'ować QNN SDK
          sed -i '/tasks.named("preBuild")/,/}/d' app/build.gradle.kts
          echo "qnnStage dependency removed"

      - name: Build Debug APK
        working-directory: work/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug -PprebuiltNativeDir=/tmp/native --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FaceFusion-Dev-NoNSFW
          path: work/android/app/build/outputs/apk/debug/*.apk